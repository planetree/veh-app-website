name: Apply Manrope typography once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-manrope-once.yml'

permissions:
  contents: write

jobs:
  update-typography:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace Source Sans 3 with Manrope
        run: |
          python3 - <<'PY'
          from pathlib import Path

          old_url = "https://fonts.googleapis.com/css2?family=Source+Sans+3:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700;8..60,800&display=swap"
          new_url = "https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"

          changed = []
          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              updated = text.replace(old_url, new_url).replace('"Source Sans 3"', '"Manrope"')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          if not changed:
              raise SystemExit('No Source Sans 3 references found.')

          print('Updated:')
          print('\n'.join(changed))
          PY

      - name: Remove one-time workflow
        run: rm .github/workflows/apply-manrope-once.yml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use Manrope for website body typography"
          git push
