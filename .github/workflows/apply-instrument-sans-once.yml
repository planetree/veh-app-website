name: Apply Instrument Sans typography once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-instrument-sans-once.yml'

permissions:
  contents: write

jobs:
  update-typography:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace Manrope with Instrument Sans
        run: |
          python3 - <<'PY'
          from pathlib import Path

          old_url = "https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
          new_url = "https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap"

          changed = []
          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              updated = text.replace(old_url, new_url).replace('"Manrope"', '"Instrument Sans"')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          if not changed:
              raise SystemExit('No Manrope references found.')

          print('Updated:')
          print('\n'.join(changed))
          PY

      - name: Remove one-time workflow
        run: rm .github/workflows/apply-instrument-sans-once.yml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use Instrument Sans for website typography"
          git push
